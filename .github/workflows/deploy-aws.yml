name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS sandbox
    runs-on: ubuntu-latest
    # Deliberately not targeting the aws-sandbox environment: doing so
    # switches the OIDC token's `sub` claim from the branch-based format
    # (repo:OWNER/REPO:ref:refs/heads/main) to an environment-based one
    # (repo:OWNER/REPO:environment:aws-sandbox), which the IAM role's
    # trust policy doesn't match — and since environment protection rules
    # are unavailable on this plan anyway (see
    # specs/05-cicd-pipeline.md's runbook step 5 addendum), there was no
    # upside to referencing it, only this OIDC breakage. See
    # specs/06-real-aws-validation.md for how this was diagnosed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Maven modules
        shell: bash
        run: |
          set -euo pipefail
          for pom in services/*/pom.xml; do
            dir=$(dirname "$pom")
            echo "::group::Building $dir"
            mvn -B -f "$pom" package
            echo "::endgroup::"
          done

      # Assumes the OIDC identity provider and AWS_DEPLOY_ROLE_ARN repo
      # secret already exist — see specs/05-cicd-pipeline.md's manual
      # AWS Console runbook (one-time setup, not automated here). Stored
      # as a secret, not a variable, so it's masked in logs — see
      # specs/05-cicd-pipeline.md's public-repo addendum.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        working-directory: terraform/envs/aws
        run: terraform init

      - name: Terraform apply
        working-directory: terraform/envs/aws
        run: terraform apply -auto-approve
